
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070e">
  <meta name="description" content="SAVII FOCUS - Your Personal Intelligence Ecosystem">
  <title>SAVII FOCUS</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #05070e;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 28px;
      border-radius: 24px;
      background: linear-gradient(135deg, #8b5cf6, #4338ca);
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 0 45px #7c3aed40;
    }

    .tag {
      color: #a78bfa;
      letter-spacing: 4px;
      font-size: 11px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(38px, 9vw, 64px);
      letter-spacing: -2px;
      margin-bottom: 16px;
    }

    h1 span {
      color: #a78bfa;
    }

    .description {
      color: #9296a8;
      line-height: 1.8;
      font-size: 15px;
      max-width: 440px;
      margin: 0 auto 30px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 17px;
      border: 1px solid #ffffff18;
      border-radius: 30px;
      background: #ffffff08;
      color: #c4b5fd;
      font-size: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #a78bfa;
      border-radius: 50%;
      box-shadow: 0 0 12px #a78bfa;
    }

    footer {
      margin-top: 65px;
      color: #55596a;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">S</div>

    <p class="tag">PERSONAL INTELLIGENCE ECOSYSTEM</p>

    <h1>SAVII <span>FOCUS</span></h1>

    <p class="description">
      One intelligent ecosystem to organize your life,
      improve your learning and understand your progress.
    </p>

    <div class="status">
      <span class="dot"></span>
      SYSTEM INITIALIZING
    </div>

    <footer>
      SAVII FOCUS · YOUR INTELLIGENCE, YOUR CONTROL
    </footer>
  </main>
</body>
</html>
